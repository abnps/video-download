# Linux (x86_64) paket: svi testovi na Ubuntu 22.04, pa PyInstaller → AppImage (beta).
# Na push: AppImage je samo artefakt pokretanja. Ručno pokretanje za tačan tag dodaje ga nacrtu izdanja.
name: Linux paket

on:
  push:
    branches: [main, linux]
  workflow_dispatch:
    inputs:
      tag:
        description: Postojeći tag nacrta izdanja, npr. v1.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-x86_64:
    # Najstariji podržani glibc: paket napravljen na 22.04 radi i na novijim sistemima.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write  # samo za dodavanje AppImage-a izdanju
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build folder (van repoa)
        run: echo "VIDEODL_BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - name: Verzija u kodu mora odgovarati tagu izdanja
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("videodl/__init__.py").read_text(encoding="utf-8")).group(1))')
          test "v$VERSION" = "$TAG" || { echo "Tag $TAG ne odgovara verziji $VERSION"; exit 1; }
          # releases/tags/… ne vraća nacrte; nacrt se traži u spisku izdanja
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\") | .draft] | tostring")" = "[true]" || { echo "Izdanje mora biti nacrt"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sistemske biblioteke za Qt (xcb, Wayland) i ffmpeg za testove
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1 libwayland-client0 libwayland-cursor0
      - name: Zavisnosti (zaključane verzije)
        run: python -m pip install -r requirements-lock.txt
      - name: Testovi i paket
        run: python tools/build_linux.py
      - name: Rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownload-linux-x86_64
          path: |
            ${{ runner.temp }}/build/linux/*.AppImage
            ${{ runner.temp }}/build/linux/*.AppImage.sha256
            ${{ runner.temp }}/build/linux/self-test.json
            ${{ runner.temp }}/build/checks.txt
          if-no-files-found: warn
      - name: Dodaj AppImage izdanju
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/build/linux"
          APP="VideoDownload-linux-x86_64-${TAG#v}.AppImage"
          sha256sum -c "$APP.sha256"
          cp "$APP" VideoDownload-linux-x86_64.AppImage
          gh release upload "$TAG" "$APP" "$APP.sha256" VideoDownload-linux-x86_64.AppImage --clobber --repo "$GITHUB_REPOSITORY"
