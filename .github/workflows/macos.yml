# Mac (Apple Silicon) paket: svi testovi na Macu, pa .app → .dmg (bez Appleovog potpisa, beta).
# Na push: .dmg je samo artefakt pokretanja. Ručno pokretanje za tačan tag dodaje ga nacrtu izdanja.
name: Mac paket

on:
  push:
    branches: [main, macos]
  workflow_dispatch:
    inputs:
      tag:
        description: Postojeći tag nacrta izdanja, npr. v0.9.8
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write  # samo za dodavanje .dmg-a izdanju
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build folder (van repoa)
        run: echo "VIDEODL_BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - name: Verzija u kodu mora odgovarati tagu izdanja
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("videodl/__init__.py").read_text(encoding="utf-8")).group(1))')
          test "v$VERSION" = "$TAG" || { echo "Tag $TAG ne odgovara verziji $VERSION"; exit 1; }
          # releases/tags/… ne vraća nacrte; nacrt se traži u spisku izdanja
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\") | .draft] | tostring")" = "[true]" || { echo "Izdanje mora biti nacrt"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Zavisnosti (zaključane verzije)
        run: python -m pip install -r requirements-lock.txt
      - name: ffmpeg za testove (paket dobija svoj, zaključan u build-lock.json)
        run: brew install ffmpeg
      - name: Testovi i paket
        run: python tools/build_macos.py
      - name: Rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownload-macOS-arm64
          path: |
            ${{ runner.temp }}/build/macos/*.dmg
            ${{ runner.temp }}/build/macos/*.dmg.sha256
            ${{ runner.temp }}/build/macos/self-test.json
            ${{ runner.temp }}/build/checks.txt
          if-no-files-found: warn
      - name: Dodaj .dmg izdanju
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/build/macos"
          DMG="VideoDownload-macOS-arm64-${TAG#v}.dmg"
          shasum -a 256 -c "$DMG.sha256"
          cp "$DMG" VideoDownload-macOS-arm64.dmg
          gh release upload "$TAG" "$DMG" "$DMG.sha256" VideoDownload-macOS-arm64.dmg --clobber --repo "$GITHUB_REPOSITORY"
