# Windows paket na GitHubu (Faza 5, Ahmed 29.10.2026): svi testovi, PyInstaller, Inno instaler i Store paket (MSIX),
# BEZ privatnog ključa. release.json potpisuje Ahmed lokalno: python tools/sign_windows.py --tag v<verzija>.
# Bez taga: samo artefakt pokretanja. S tagom postojećeg nacrta: instaler ide u taj nacrt.
name: Windows paket

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag postojećeg nacrta izdanja (npr. v1.0.6); prazno = samo artefakt
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write  # samo za dodavanje instalera nacrtu
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build folder (van repoa)
        run: echo "VIDEODL_BUILD_DIR=$env:RUNNER_TEMP\build" >> $env:GITHUB_ENV
      - name: Verzija u kodu mora odgovarati tagu, a izdanje mora biti nacrt
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content videodl/__init__.py -Raw), '__version__ = "([^"]+)"').Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG ne odgovara verziji $version" }
          # releases/tags/… ne vraća nacrte; nacrt se traži u spisku izdanja
          $found = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json |
                     Where-Object { $_.tag_name -eq $env:TAG })
          if ($found.Count -ne 1 -or -not $found[0].draft) { throw "Izdanje $env:TAG mora postojati kao nacrt" }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Zavisnosti (zaključane verzije)
        run: python -m pip install -r requirements-lock.txt
      - name: Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "VIDEODL_ISCC=${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" >> $env:GITHUB_ENV
      - name: Zaključani ffmpeg i Node (SHA-256 iz build-lock.json)
        run: python tools/fetch_windows_tools.py  # upisuje foldere u GITHUB_PATH
      - name: Testovi i instaler (bez potpisa)
        run: python tools/build_release.py --unsigned
      - name: Microsoft Store paket (MSIX)
        run: |
          python -m pip install pillow==12.3.0  # samo za ikone Store paketa (ne ide u program)
          python tools/build_msix.py
      - name: Rezultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownload-windows-x64
          path: |
            ${{ runner.temp }}/build/installer/*.exe
            ${{ runner.temp }}/build/installer/*.sha256
            ${{ runner.temp }}/build/installer/release-notes.md
            ${{ runner.temp }}/build/msix/*.msix
            ${{ runner.temp }}/build/self-test.json
            ${{ runner.temp }}/build/checks.txt
          if-no-files-found: warn
      - name: Dodaj instaler nacrtu
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd "$env:RUNNER_TEMP\build\installer"
          $exe = "VideoDownload-Setup-$($env:TAG.Substring(1)).exe"
          $expected = (Get-Content "$exe.sha256").Split(" ")[0]
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw "SHA-256 se ne slaže" }
          gh release upload $env:TAG $exe "$exe.sha256" VideoDownload-Setup.exe --clobber --repo $env:GITHUB_REPOSITORY
          gh release edit $env:TAG --notes-file release-notes.md --repo $env:GITHUB_REPOSITORY
