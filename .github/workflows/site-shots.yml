# Snimci programa za sajt (odjeljak „Na svakoj platformi"): prozor kako ga iscrtaju pravi Mac i pravi Linux.
# Samo ručno pokretanje ili grana sajt-platforme; ništa ne objavljuje, rezultat je artefakt (PNG).
# Windows i Android snimci se prave lokalno: python tools/site_platform_shots.py desktop|android --out …
name: Snimci za sajt

on:
  push:
    branches: [sajt-platforme]
    paths: [".github/workflows/site-shots.yml", "tools/site_platform_shots.py", "tools/store_screenshots.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: ffmpeg (pravi paket ga nosi; bez njega program pokaže upozorenje)
        run: brew install ffmpeg
      - name: Zavisnosti (zaključane verzije)
        run: python -m pip install -r requirements-lock.txt
      - name: Snimci (pravi Mac prozor)
        run: python tools/site_platform_shots.py desktop --out "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v7
        with:
          name: site-shots-macos
          path: ${{ runner.temp }}/shots/macos-*.png
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Qt biblioteke, X server i Ubuntu font (kao na Ubuntu radnoj površini)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb ffmpeg fonts-ubuntu libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1
          # Ubuntu radna površina: „sans-serif" je font Ubuntu (zamjena za Segoe UI koji Linux nema)
          mkdir -p ~/.config/fontconfig
          printf '%s\n' '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig>' \
            '<alias><family>sans-serif</family><prefer><family>Ubuntu</family></prefer></alias></fontconfig>' \
            > ~/.config/fontconfig/fonts.conf
      - name: Zavisnosti (zaključane verzije)
        run: python -m pip install -r requirements-lock.txt
      - name: Snimci (pravi X11 prozor)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tools/site_platform_shots.py desktop --out "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v7
        with:
          name: site-shots-linux
          path: ${{ runner.temp }}/shots/linux-*.png
          if-no-files-found: error
