# Desktop, sajt i Android provjere na svaki push i PR.
name: Testovi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Zavisnosti (zaključane verzije)
        run: python -m pip install -r requirements-lock.txt
      - name: ffmpeg (testovi titlova, konverzije i prenosa uživo)
        run: choco install ffmpeg -y --no-progress
      - name: Python testovi
        run: python -m unittest discover -s tests -v
      - name: JS testovi (dodatak)
        run: node --test "tests/extension/*.test.mjs"
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""  # podrazumijevani paket „tools" više ne postoji i obara posao
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Android lint, Kotlin testovi i debug APK
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
