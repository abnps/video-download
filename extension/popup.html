<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Video Download</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>Video Download</h1>
    <span id="version" class="version"></span>
    <span id="app-status" class="app-status"></span>
  </header>

  <p id="page-title" class="page-title"></p>

  <p id="drm" class="notice danger" data-i18n="popup.drm" hidden></p>

  <button id="download-playing" class="primary" type="button" data-i18n="popup.playing"></button>
  <button id="download-playing-mp3" class="secondary" type="button" data-i18n="popup.playing_mp3"></button>
  <p class="hint" data-i18n="popup.playing_hint"></p>
  <button id="download-page" class="secondary" type="button" data-i18n="popup.page"></button>
  <p class="hint" data-i18n="popup.page_hint"></p>

  <section>
    <h2 data-i18n="popup.streams"></h2>
    <ul id="media-list" class="media-list"></ul>
    <p id="media-empty" class="hint" data-i18n="popup.streams_empty"></p>
  </section>

  <p id="result" class="result" role="status"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
